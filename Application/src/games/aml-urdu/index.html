<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — AML/KYC Compliance Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-a:#F4F9FD;
  --page-b:#E3EEF7;
  --surface:#FFFFFF;
  --surface2:#F5F8FB;
  --line:#DCE6EF;
  --ink:#10202F;
  --text:#2A3B4C;
  --muted:#6B7F92;
  --teal:#0FA98A;
  --blue:#3B7DE8;
  --amber:#E39A0C;
  --coral:#E2493C;
  --violet:#8B5CF6;
  --gold:#C9962C;
  --green:#22C55E;
  --grad-a:#C084FC;
  --grad-b:#34E0C0;
  --shadow:0 10px 30px -12px rgba(16,32,47,.18);
  --shadow-lg:0 22px 50px -20px rgba(16,32,47,.28);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --r:12px;

  /* legacy aliases — the existing rules below still reference these names.
     Mapping them here converts the whole sheet without touching every rule. */
  --bg:var(--page-a);
  --bg2:var(--page-b);
  --panel:var(--surface);
  --panel2:var(--surface2);
  --panel3:#E9F0F7;
  --border:var(--line);
  --border2:#C6D5E4;
  --dim:#8FA1B3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100dvh}
body{
  background:linear-gradient(160deg,var(--page-a) 0%,var(--page-b) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--sans);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{color:var(--ink)}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
#confetti{position:fixed;inset:0;z-index:90;pointer-events:none}
#app{position:relative;z-index:4;min-height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;
  padding:12px 22px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line); box-shadow:0 4px 20px -14px rgba(16,32,47,.35);
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand svg{width:34px;height:34px;flex:none}
.brand-txt .n{font-weight:700;font-size:15px;letter-spacing:.14em}
.brand-txt .t{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.tb-spacer{flex:1}

.rankchip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:40px;padding:5px 14px 5px 6px}
.rankchip svg{width:30px;height:30px;flex:none}
.rankchip .rk{font-size:12px;font-weight:600;line-height:1.25}
.rankchip .xp{font-family:var(--mono);font-size:10px;color:var(--muted)}
.xpbar{width:120px;height:5px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:4px;transition:width .7s cubic-bezier(.2,.9,.3,1)}

.iconbtn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);color:var(--muted);cursor:pointer;
  display:grid;place-items:center;transition:.18s;flex:none;
}
.iconbtn:hover{color:var(--text);border-color:var(--border2);background:var(--panel2)}
.iconbtn.muted{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 35%,var(--border))}
.iconbtn svg{width:17px;height:17px}
.langbtn{width:auto;min-width:36px;padding:0 9px;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.04em}

body.lang-ur #app,body.lang-ur #stage,body.lang-ur #toasts,body.lang-ur .cmodal,body.lang-ur #splash{
  direction:rtl;
}
body.lang-ur{
  --sans:'Noto Nastaliq Urdu','IBM Plex Sans',system-ui,sans-serif;
}
body.lang-ur .cbubble{line-height:2.05;font-size:17px}
body.lang-ur .crow{text-align:right;line-height:1.9}
body.lang-ur .hero h1,body.lang-ur .sechead h2,body.lang-ur .mcard h3,body.lang-ur .mhead h2,body.lang-ur .mhead .back{line-height:1.55}
body.lang-ur .eyebrow,body.lang-ur .cbubble .who,body.lang-ur .mcard .mk,body.lang-ur .mhead .tag,
body.lang-ur .hudpill .lbl,body.lang-ur .stat .l,body.lang-ur .brand-txt .t,body.lang-ur .cprompt{
  text-transform:none;letter-spacing:.02em;
}
body.lang-ur .cnext svg,body.lang-ur .play svg,body.lang-ur .back svg{transform:scaleX(-1)}
body.lang-ur .drow .v{text-align:left}
@media(max-width:560px){body.lang-ur .drow .v{text-align:right}}
/* Nastaliq glyphs overflow a 1.25 line box, so rank name painted over XP. */
body.lang-ur .rankchip{padding:8px 16px 8px 8px}
body.lang-ur .rankchip > div{display:flex;flex-direction:column;gap:6px;min-width:0}
body.lang-ur .rankchip .rk,body.lang-ur .rankchip .xp{line-height:1.75}
body.lang-ur .rankchip .xp{font-family:var(--sans)}
body.lang-ur .xpbar{margin-top:2px}

/* ---------------- stage ---------------- */
#stage{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:30px 22px 70px}
.screen{animation:fadeUp .45s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------------- hero ---------------- */
.hero{
  position:relative;display:grid;grid-template-columns:1fr 330px;gap:26px;align-items:center;
  background:linear-gradient(135deg,#FFFFFF 0%,#F3F8FD 60%,#EAF3FB 100%);
  border:1px solid var(--line);border-radius:18px;padding:34px 34px;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(700px 240px at 88% 22%,rgba(43,217,176,.20),transparent 65%),
             radial-gradient(500px 220px at 10% 100%,rgba(76,141,246,.16),transparent 70%);
}
.hero-l{position:relative;z-index:2}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--teal)}
.hero h1{font-size:38px;line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:12px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(92deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14.5px;line-height:1.65;max-width:52ch}
.hero-art{position:relative;z-index:2;display:grid;place-items:center}
.hero-art svg{width:100%;max-width:310px;height:auto}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:26px}.hero h1{font-size:29px}.hero-art{display:none}}

.statrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{background:rgba(255,255,255,.72);border:1px solid var(--border);border-radius:10px;padding:9px 14px;min-width:96px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}

.home-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.85fr);gap:18px;align-items:stretch;margin-bottom:8px}
.home-top .hero{max-width:none}
.achieve-box{
  position:relative;z-index:2;
  background:linear-gradient(135deg,#FFFFFF 0%,#F3F8FD 60%,#EAF3FB 100%);
  border:1px solid var(--line);border-radius:18px;padding:26px 24px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  text-align:center;align-items:center;justify-content:center;
}
.achieve-box h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.achieve-box .d{font-size:12.5px;color:var(--muted);margin-top:3px;margin-bottom:16px}
.achieve-box .badgerow{
  margin-top:0;width:100%;
  display:grid;grid-template-columns:repeat(2,76px);
  justify-content:center;justify-items:center;gap:16px 28px;
}
.achieve-box .btn{margin-top:18px;align-self:center}
@media(max-width:900px){.home-top{grid-template-columns:1fr}}

/* ---------------- section head ---------------- */
.sechead{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:22px 0 18px;padding:18px 22px 18px 24px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  overflow:hidden;
}
.sechead::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--teal),var(--blue));
}
.sechead .eyebrow{margin-bottom:6px}
.sechead h2{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.sechead .d{font-size:14.5px;color:var(--text);margin-top:6px;max-width:62ch;line-height:1.5}

/* ---------------- mission grid ---------------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.mcard{
  position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:20px;cursor:pointer;overflow:hidden;transition:.22s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;min-height:238px;
}
.mcard::before{content:'';position:absolute;left:0;top:0;height:3px;width:100%;background:var(--c);opacity:.85}
.mcard::after{content:'';position:absolute;right:-70px;top:-70px;width:190px;height:190px;border-radius:50%;background:var(--c);opacity:.06;transition:.3s}
.mcard:hover{transform:translateY(-4px);border-color:var(--border2);box-shadow:var(--shadow-lg)}
.mcard:hover::after{opacity:.13;transform:scale(1.15)}
.micon{width:48px;height:48px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);margin-bottom:14px;position:relative;z-index:2}
.micon svg{width:25px;height:25px;color:var(--c)}
.mcard h3{font-size:15.5px;font-weight:600;position:relative;z-index:2}
.mcard .mk{font-family:var(--mono);font-size:10px;color:var(--c);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;position:relative;z-index:2}
.mcard p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:8px;flex:1;position:relative;z-index:2}
.mfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:1px solid var(--border);position:relative;z-index:2}
.mmeta{font-family:var(--mono);font-size:11px;color:var(--dim)}
.mbest{font-family:var(--mono);font-size:11px;color:var(--teal)}
.play{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}

/* ---------------- buttons ---------------- */
.btn{
  font-family:var(--sans);font-weight:600;font-size:13.5px;
  padding:12px 22px;border-radius:9px;border:1px solid var(--border2);
  background:var(--panel2);color:var(--text);cursor:pointer;transition:.18s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:var(--panel3);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--teal),#0B8F74);color:#FFFFFF;border-color:transparent;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.09)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;justify-content:center}
.btn svg,.back svg,.play svg{width:15px;height:15px;flex:none}

/* ---------------- generic panel ---------------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.panel.alt{background:var(--panel2)}
.panel,.mcard,.stat,.hudpill,.rankchip,.iconbtn{box-shadow:var(--shadow)}
.stat{background:var(--surface)}

/* mission chrome */
.mhead{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.mhead .back{cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:13px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);padding:8px 13px;border-radius:8px;transition:.18s}
.mhead .back:hover{color:var(--text);border-color:var(--border2)}
.mhead h2{font-size:18px;font-weight:600}
.mhead .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.mhead-spacer{flex:1}

.hudpill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 13px;font-family:var(--mono);font-size:12px}
.hudpill b{font-weight:600}
.hudpill .lbl{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}

.progline{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progline i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .45s cubic-bezier(.2,.9,.3,1)}

/* ---------------- dialogue mission ---------------- */
.dlg-wrap{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.dlg-wrap{grid-template-columns:1fr}}
.persona{text-align:center}
.persona .av{width:150px;height:150px;margin:0 auto 14px;filter:drop-shadow(0 12px 24px rgba(16,32,47,.22))}
.persona .nm{font-size:15px;font-weight:600}
.persona .rl{font-size:12px;color:var(--muted);margin-top:3px}
.meterlist{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);text-align:left}
.meter{margin-bottom:12px}
.meter .mrow{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px}
.meter .mrow span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meter .mrow span:last-child{font-family:var(--mono)}
.meter .bar{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.9,.3,1)}

.cdd-steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cdd-step{
  flex:1;min-width:78px;text-align:center;padding:10px 10px;border-radius:40px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  border:1px solid var(--border);font-size:12px;font-weight:600;
  color:var(--muted);letter-spacing:.06em;text-transform:uppercase;transition:.25s;
  box-shadow:0 6px 16px -12px rgba(16,32,47,.35);
}
.cdd-step.on{
  background:linear-gradient(135deg,#12C4A0,var(--teal) 40%,#0C8F75);
  border-color:transparent;color:#fff;font-weight:700;
  box-shadow:0 10px 22px -8px rgba(15,169,138,.7);
  transform:translateY(-2px) scale(1.05);
}
.cdd-step.done{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,var(--border));background:rgba(255,255,255,.94)}

.bubble{
  position:relative;background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:10px;padding:16px 18px;font-size:14.5px;line-height:1.7;margin-bottom:8px;
  animation:pop .35s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.bubble.sys{border-left-color:var(--violet);background:var(--panel);font-size:13px;color:var(--muted);font-style:italic}
.bubble .who{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:7px}
.bubble.sys .who{color:var(--violet)}
.dlg-log{max-height:230px;overflow-y:auto;margin-bottom:14px;padding-right:6px}
.dlg-log::-webkit-scrollbar{width:5px}
.dlg-log::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.dlg-log .bubble{opacity:.5;font-size:13px;padding:11px 14px}
.dlg-log .you{border-left-color:var(--teal)}
.dlg-log .you .who{color:var(--teal)}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.choice{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;font-size:13.5px;line-height:1.55;color:var(--text);cursor:pointer;
  transition:.16s;font-family:var(--sans);display:flex;gap:12px;align-items:flex-start;
}
.choice:hover:not(:disabled){border-color:var(--teal);background:var(--panel2);transform:translateX(3px)}
.choice:disabled{cursor:default}
.choice .num{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none;margin-top:2px;width:16px}
.choice.good{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 9%,transparent)}
.choice.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 9%,transparent)}
.choice.meh{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.choice.faded{opacity:.32}

/* ---------------- verdict / feedback ---------------- */
.verdict{
  margin-top:16px;padding:15px 17px;border-radius:10px;border-left:3px solid;
  font-size:13.5px;line-height:1.7;animation:fadeUp .3s;
}
.verdict .vt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:600}
.verdict.good{background:color-mix(in srgb,var(--teal) 10%,transparent);border-color:var(--teal)}
.verdict.good .vt{color:var(--teal)}
.verdict.bad{background:color-mix(in srgb,var(--coral) 10%,transparent);border-color:var(--coral)}
.verdict.bad .vt{color:var(--coral)}
.verdict.meh{background:color-mix(in srgb,var(--amber) 10%,transparent);border-color:var(--amber)}
.verdict.meh .vt{color:var(--amber)}
.verdict .cite{display:block;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}

.cmodal{
  position:fixed;inset:0;z-index:140;display:grid;place-items:center;padding:22px;
  background:rgba(16,32,47,.45);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .22s ease;overflow:hidden;
}
.cmodal.in{opacity:1}
.cmodal-card{
  width:fit-content;min-width:min(440px, calc(100vw - 44px));
  max-width:min(920px, calc(100vw - 44px));
  overflow:visible;
  background:linear-gradient(160deg,#FFFFFF 0%,#F4F9FD 100%);
  border:1px solid rgba(255,255,255,.9);border-radius:20px;
  padding:28px 28px 22px;position:relative;
  box-shadow:0 30px 64px -22px rgba(16,32,47,.5);
  animation:bpop .32s cubic-bezier(.2,1.2,.4,1);
}
.cmodal-card::before{
  content:'';position:absolute;inset:-2px;border-radius:22px;z-index:-1;
  background:linear-gradient(120deg,var(--grad-a),var(--grad-b));
}
.cmodal-card .verdict{margin-top:0;padding:16px 18px}
.cmodal-foot{display:flex;justify-content:center;margin-top:20px}
.cmodal-foot .cnext{
  margin-left:0;margin-right:0;white-space:nowrap;flex-shrink:0;
  justify-content:center;min-width:180px;padding:13px 36px}

/* ---------------- radar mission ---------------- */
.radar-wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.radar-wrap{grid-template-columns:1fr}}
.radar-box{display:grid;place-items:center;padding:10px}
.radar-box svg{width:100%;max-width:210px}
.rsweep{transform-origin:100px 100px;animation:spin 3.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rblip{opacity:0;animation:blip 3.4s linear infinite}
@keyframes blip{0%,6%{opacity:1}55%,100%{opacity:0}}

.flagcard{
  background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--border2);
  border-radius:14px;padding:26px 24px;min-height:150px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;animation:dealIn .4s cubic-bezier(.2,1.1,.35,1);
}
@keyframes dealIn{from{opacity:0;transform:translateY(20px) rotate(-1.5deg) scale(.97)}to{opacity:1;transform:none}}
.flagcard .obs{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:11px}
.flagcard .txt{font-size:16.5px;line-height:1.6;font-weight:500}
.flagcard .wm{position:absolute;right:-14px;bottom:-26px;font-family:var(--mono);font-size:82px;font-weight:700;opacity:.045;letter-spacing:-.04em}

.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}
.catbtn{
  text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px;
  cursor:pointer;transition:.16s;font-family:var(--sans);color:var(--text);
}
.catbtn:hover:not(:disabled){border-color:var(--blue);background:var(--panel2);transform:translateY(-2px)}
.catbtn:disabled{cursor:default}
.catbtn .cl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:4px}
.catbtn .cn{font-size:13px;font-weight:600;line-height:1.35}
.catbtn.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.catbtn.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.catbtn.dimmed{opacity:.3}

.combo{font-family:var(--mono);font-size:12px;color:var(--amber);transition:.2s}
.combo.hot{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.timerbar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .1s linear}
.timerbar.danger i{background:var(--coral)}

/* ---------------- console mission ---------------- */
.con-wrap{display:grid;grid-template-columns:minmax(300px,.42fr) 1fr;gap:18px;align-items:stretch;width:100%}
@media(max-width:860px){.con-wrap{grid-template-columns:1fr}}
.dossier h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.field{margin-bottom:13px}
.field .fl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field .fv{font-family:var(--mono);font-size:12.5px;line-height:1.5}
.risktag{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.risktag.low{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.risktag.med{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.risktag.high{background:color-mix(in srgb,var(--coral) 15%,transparent);color:var(--coral)}

.case-wrap{position:relative;overflow:hidden}
.case-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.case-id{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.amtrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.amt{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.02em}
.amt .cur{font-size:15px;color:var(--muted);margin-right:6px}
.ttype{font-size:12.5px;color:var(--muted);margin-top:3px}
.thermo{width:100%;margin:14px 0 18px}
.thermo svg{width:100%;height:52px}

.drow{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.drow:last-child{border-bottom:none}
.drow .k{color:var(--muted);flex:none}
.drow .v{font-family:var(--mono);text-align:right}
.narr{background:var(--panel2);border-radius:9px;padding:14px 16px;font-size:13px;line-height:1.7;margin:16px 0 18px;border-left:2px solid var(--border2)}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.acts{grid-template-columns:1fr}}
.act{
  font-family:var(--sans);font-weight:600;font-size:13px;padding:14px 8px;border-radius:9px;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;transition:.16s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.act small{font-weight:400;font-size:10px;color:var(--dim);letter-spacing:.04em}
.act:hover:not(:disabled){transform:translateY(-2px)}
.act[data-a=clear]:hover:not(:disabled){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.act[data-a=flag]:hover:not(:disabled){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.act[data-a=escalate]:hover:not(:disabled){border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.act:disabled{opacity:.32;cursor:default}
.act.picked{opacity:1!important;border-width:2px}

.reasons{display:none;margin-top:16px;padding:18px 20px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);animation:fadeUp .3s}
.reasons.show{display:block}
#fbslot{margin-top:14px}
.reasons .h{font-size:12px;color:var(--muted);margin-bottom:11px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-family:var(--mono);
  padding:8px 13px;margin:0 7px 7px 0;border-radius:7px;border:1px solid var(--border2);
  background:var(--panel);cursor:pointer;transition:.15s;user-select:none;
}
.chip:hover{border-color:var(--amber)}
.chip.on{border-color:var(--amber);color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.chip.correct-r{border-color:var(--teal);color:var(--teal)}
.chip.missed{border-color:var(--teal);border-style:dashed;color:var(--teal);opacity:.75}

.stamp{
  position:absolute;top:38%;left:50%;
  transform:translate(-50%,-50%) rotate(-11deg) scale(.35);
  font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.16em;
  padding:11px 26px;border:3px solid;border-radius:8px;opacity:0;pointer-events:none;
  text-transform:uppercase;z-index:5;
  transition:transform .4s cubic-bezier(.15,1.5,.4,1),opacity .2s;
}
.stamp.show{opacity:.95;transform:translate(-50%,-50%) rotate(-11deg) scale(1)}
.stamp.good{color:var(--teal);border-color:var(--teal);background:rgba(43,217,176,.09)}
.stamp.bad{color:var(--coral);border-color:var(--coral);background:rgba(255,95,82,.09)}

/* ---------------- threshold trainer ---------------- */
.tt-wrap{max-width:760px;margin:0 auto}
.gauge{display:grid;place-items:center;margin-bottom:6px}
.gauge svg{width:100%;max-width:390px;height:auto}
.tt-ctx{text-align:center;margin-bottom:20px}
.tt-ctx .who{font-size:14px;font-weight:600}
.tt-ctx .note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 15px;
  cursor:pointer;transition:.16s;text-align:left;font-family:var(--sans);color:var(--text);
}
.opt:hover:not(:disabled){border-color:var(--violet);transform:translateY(-2px);background:var(--panel2)}
.opt:disabled{cursor:default}
.opt .ok{font-family:var(--mono);font-size:13px;font-weight:600;display:block}
.opt .od{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.opt.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,transparent)}
.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent)}
.opt.dimmed{opacity:.3}

/* ---------------- vault / glossary ---------------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.vcard{perspective:1100px;height:186px;cursor:pointer}
.vinner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.vcard.flip .vinner{transform:rotateY(180deg)}
.vface{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:18px;
  border:1px solid var(--border);display:flex;flex-direction:column;
}
.vfront{background:linear-gradient(150deg,var(--panel2),var(--panel));justify-content:space-between}
.vfront .vt{font-size:16px;font-weight:600}
.vfront .vk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.vfront .hint{font-size:11px;color:var(--dim)}
.vback{background:var(--panel3);transform:rotateY(180deg);justify-content:center}
.vback p{font-size:12.5px;line-height:1.65;color:var(--text)}
.vback .src{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:10px;letter-spacing:.05em}
.vseen{position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--teal);opacity:0;transition:.3s}
.vcard.was-seen .vseen{opacity:1}

/* ---------------- results ---------------- */
.res{text-align:center;padding:16px 0}
.res .bigscore{font-family:var(--mono);font-size:66px;font-weight:700;line-height:1;letter-spacing:-.03em}
.res .grade{font-size:15px;font-weight:600;margin-top:10px}
.res .blurb{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:56ch;margin-inline:auto;line-height:1.65}
.xpgain{display:inline-flex;align-items:center;gap:7px;margin-top:18px;background:color-mix(in srgb,var(--teal) 12%,transparent);border:1px solid var(--teal);color:var(--teal);font-family:var(--mono);font-size:13px;padding:8px 18px;border-radius:30px;animation:pop .5s}
.brk{max-width:460px;margin:26px auto 0;text-align:left}
.brk-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.brk-row .bl{flex:1;font-size:13px;text-transform:capitalize}
.brk-row .bb{width:96px;height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
.brk-row .bb i{display:block;height:100%;border-radius:4px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.brk-row .bv{font-family:var(--mono);font-size:12px;width:42px;text-align:right;color:var(--muted)}
.res-actions{display:flex;gap:11px;justify-content:center;margin-top:28px;flex-wrap:wrap}

/* ---------------- certificate ---------------- */
.cert{background:linear-gradient(150deg,#FFFDF6,#FFF8E8);border:1px solid var(--gold);border-radius:16px;padding:40px;text-align:center;position:relative;overflow:hidden;max-width:660px;margin:0 auto}
.cert::before{content:'';position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);border-radius:10px;pointer-events:none}
.cert .seal{width:104px;height:104px;margin:0 auto 18px}
.cert .ct{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.cert h3{font-size:26px;margin:14px 0 6px;font-weight:700}
.cert .cn{font-size:14px;color:var(--muted);line-height:1.7;max-width:46ch;margin-inline:auto}
.cert .cline{display:flex;justify-content:center;gap:34px;margin-top:26px;padding-top:22px;border-top:1px solid color-mix(in srgb,var(--gold) 20%,transparent);flex-wrap:wrap}
.cert .cline div{font-family:var(--mono);font-size:12px}
.cert .cline span{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px;font-family:var(--sans)}

/* ---------------- badges ---------------- */
.badgerow{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.badge{width:76px;text-align:center;opacity:.38;transition:.3s;filter:grayscale(1) saturate(.2)}
.badge.earned{opacity:1;filter:none}
.badge img{width:64px;height:64px;object-fit:cover;border-radius:50%;
  display:block;margin:0 auto;background:#0B1220;
  box-shadow:0 6px 14px -8px rgba(16,32,47,.45)}
.badge.earned img{box-shadow:0 8px 18px -6px rgba(16,32,47,.5),0 0 16px -4px rgba(201,150,44,.45)}
.badge .bn{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.3;font-weight:600}

/* ---------------- toast ---------------- */
#toasts{position:fixed;top:72px;left:0;right:0;z-index:150;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{
  background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--teal);
  border-radius:10px;padding:13px 17px;font-size:13px;box-shadow:var(--shadow-lg);
  animation:slideIn .35s cubic-bezier(.2,1.1,.4,1);max-width:360px;pointer-events:auto;
}
.toast.out{animation:slideOut .3s forwards}
.toast .tt{font-weight:600;display:block;margin-bottom:3px}
.toast .td{color:var(--muted);font-size:12px;line-height:1.5}
@keyframes slideIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateY(-18px)}}

.note{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:26px;text-align:center;border-top:1px solid var(--border);padding-top:18px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--muted)}
.hidden{display:none!important}

/* ================= cinematic layer ================= */
#cine{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cine-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .6s ease;transform:scale(1.04)}
.cine-bg.in{opacity:1}
.cine-scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(244,249,253,.55) 0%,rgba(244,249,253,.20) 35%,rgba(227,238,247,.72) 100%)}

#actors{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.actor{position:absolute;bottom:0;height:74vh;max-height:640px;width:auto;
  opacity:0;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.9,.3,1);
  filter:drop-shadow(0 18px 34px rgba(16,32,47,.22))}
.actor.left{left:2vw;transform:translateX(-60px)}
.actor.right{right:2vw;transform:translateX(60px)}
.actor.in{opacity:1;transform:translateX(0)}
.actor.idle{animation:float 4s ease-in-out infinite}
.actor.home-hero{bottom:0;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
body.lang-ur .actor.left{left:auto;right:2vw;transform:translateX(60px) scaleX(-1)}
body.lang-ur .actor.right{right:auto;left:2vw;transform:translateX(-60px) scaleX(-1)}
body.lang-ur .actor.in{transform:translateX(0) scaleX(-1)}
body.lang-ur .actor.idle{animation-name:float-ur}
@keyframes float-ur{0%,100%{transform:translateY(0) scaleX(-1)}50%{transform:translateY(-6px) scaleX(-1)}}
@media(max-width:900px){.actor{height:42vh;opacity:.35!important}}

/* speech bubble */
.cbubble{position:relative;background:var(--surface);border-radius:16px;
  padding:20px 24px;font-size:16px;line-height:1.65;color:var(--ink);
  box-shadow:var(--shadow-lg);max-width:62ch;
  animation:bpop .32s cubic-bezier(.2,1.2,.4,1)}
#bubbleslot{display:flex;flex-direction:column;gap:18px}
.cbubble::before{content:'';position:absolute;inset:-2px;border-radius:18px;z-index:-1;
  background:linear-gradient(120deg,var(--grad-a),var(--grad-b))}
.cbubble .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cbubble .caret{display:inline-block;width:2px;height:1em;background:var(--ink);
  vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes bpop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* answer list */
.cprompt{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;
  font-weight:700;font-size:13px;letter-spacing:.01em;padding:10px 18px;border-radius:8px;
  box-shadow:var(--shadow);margin-bottom:14px}
.cchoices{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:14px 18px;
  font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--text);
  cursor:pointer;box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.crow.shown{opacity:1;transform:none;transition:opacity .3s ease,transform .3s ease}
.crow:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--grad-b)}
.crow .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface2);color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:600;
  transition:.16s}
.crow:hover:not(:disabled) .ic{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}
.crow.good{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,#fff)}
.crow.good .ic{background:var(--teal);color:#fff}
.crow.meh{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,#fff)}
.crow.meh .ic{background:var(--amber);color:#fff}
.crow.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,#fff)}
.crow.bad .ic{background:var(--coral);color:#fff}
.crow.faded{opacity:.4}
.crow:disabled{cursor:default}

.cnext{position:relative;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#0C2A25;font-weight:700;
  font-size:14px;padding:13px 26px;border:none;border-radius:10px;cursor:pointer;
  box-shadow:var(--shadow-lg);transition:.16s;white-space:nowrap;flex-shrink:0}
.cnext:hover{filter:brightness(1.06);transform:translateY(-1px)}
.cnext svg{width:14px;height:14px;flex:none}
#ctaslot{display:flex;justify-content:flex-end;width:100%}
#ctaslot.cta-mid{justify-content:center}
#ctaslot.cta-mid .cnext{margin-left:0}
#ctaslot .cnext,#startbtn{margin-right:0}

/* countdown ring */
.ring{position:relative;width:82px;height:82px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .trk{fill:rgba(255,255,255,.75);stroke:var(--line);stroke-width:7}
.ring .prg{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .1s linear,stroke .3s ease}
.ring.danger .prg{stroke:var(--coral)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.ring.danger .lbl{color:var(--coral)}

/* scene-mode: content sits between sprites; characters paint above the box */
body.scene #app{z-index:auto}
body.scene .topbar{z-index:120}
body.scene #actors{z-index:50}
body.scene #stage{
  position:relative;z-index:2;max-width:1180px;
  padding-inline:clamp(24px,16vw,220px);
}
body.scene .screen > .panel{margin-inline:auto;width:100%}
body.scene .panel,body.scene .hudpill,body.scene .mhead .back{
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px)}
.skipbtn{position:fixed;bottom:20px;right:20px;z-index:130;background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:30px;
  padding:9px 18px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);
  cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.skipbtn:hover{color:var(--ink)}
body.lang-ur .skipbtn{right:auto;left:20px}

/* ---------------- splash ---------------- */
body.splashing{overflow:hidden}
#splash{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#F4F9FD 0%,#E3EEF7 100%);
  cursor:pointer;user-select:none;touch-action:manipulation;
  transition:opacity .45s ease,visibility .45s ease;
}
#splash::before,#splash::after{
  content:'';position:absolute;border-radius:50%;pointer-events:none;
}
#splash::before{
  width:520px;height:520px;top:-140px;right:-80px;
  background:radial-gradient(circle,rgba(15,169,138,.22),transparent 68%);
}
#splash::after{
  width:460px;height:460px;bottom:-160px;left:-100px;
  background:radial-gradient(circle,rgba(59,125,232,.20),transparent 68%);
}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.splash-mark{
  width:92px;height:92px;
  filter:drop-shadow(0 12px 24px rgba(15,169,138,.28));
  animation:splashPop .7s cubic-bezier(.2,1.2,.4,1);
}
.splash-mark svg{width:100%;height:100%}
.splash-eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--teal);
  text-transform:uppercase;margin-top:26px;
  animation:splashFade .45s .06s ease both;
}
.splash-name{
  font-size:42px;font-weight:700;letter-spacing:.18em;line-height:1.1;margin-top:10px;color:var(--ink);
  animation:splashFade .5s .12s ease both;
}
.splash-sub{
  font-size:13px;color:var(--text);letter-spacing:.12em;text-transform:uppercase;margin-top:8px;
  animation:splashFade .5s .18s ease both;
}
.splash-lang{
  margin-top:22px;direction:ltr;cursor:default;
  animation:splashFade .45s .2s ease both;
}
.splash-lang-hint{margin-bottom:12px}
.splash-lang-arrow{
  display:block;width:10px;height:10px;margin:0 auto 8px;
  border-right:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);
  transform:rotate(45deg);
  animation:langPoint .9s ease-in-out infinite;
}
.splash-lang-lbl{
  font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.04em;margin-bottom:2px;
}
.splash-lang-lbl2{
  font-family:'Noto Nastaliq Urdu','IBM Plex Sans',sans-serif;
  font-size:15px;font-weight:600;color:var(--teal);line-height:2;margin-bottom:4px;
}
body.lang-ur .splash-lang-lbl{letter-spacing:.02em;text-transform:none}
.splash-lang-row{
  display:inline-flex;border:1px solid color-mix(in srgb,var(--teal) 45%,var(--border));
  border-radius:999px;
  background:rgba(255,255,255,.88);box-shadow:var(--shadow);
  overflow:hidden;animation:langPulse 1.7s ease-in-out infinite;
}
.splash-lang.picked .splash-lang-arrow{animation:none;opacity:.3}
.splash-lang.picked .splash-lang-row{animation:none;border-color:var(--border)}
@keyframes langPoint{
  0%,100%{transform:translateY(0) rotate(45deg);opacity:1}
  50%{transform:translateY(6px) rotate(45deg);opacity:.55}
}
@keyframes langPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(15,169,138,.28),var(--shadow)}
  50%{box-shadow:0 0 0 8px rgba(15,169,138,.08),var(--shadow)}
}
.splash-langbtn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--muted);
  background:transparent;border:0;padding:12px 22px;cursor:pointer;min-width:108px;min-height:44px;
  transition:background .18s,color .18s;
}
.splash-langbtn:hover{color:var(--ink);background:var(--panel2)}
.splash-langbtn.on{
  background:linear-gradient(135deg,var(--teal),#0B8F74);color:#fff;
}
.splash-langbtn[data-lang="ur"]{font-family:'Noto Nastaliq Urdu','IBM Plex Sans',sans-serif;font-size:15px;line-height:1.6}
.splash-bar{
  width:220px;height:4px;background:var(--panel3);border-radius:4px;overflow:hidden;margin-top:22px;
  animation:splashFade .45s .22s ease both;
}
.splash-bar i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--teal),var(--blue));
  border-radius:4px;transition:width .2s linear;
}
.splash-status{
  font-family:var(--mono);font-size:11px;color:var(--text);letter-spacing:.08em;margin-top:12px;
  animation:splashFade .45s .26s ease both;
  border:0;background:transparent;padding:0;cursor:default;
}
.splash-status.is-go{
  cursor:pointer;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:0;
  color:#fff;margin-top:18px;padding:12px 28px;border-radius:9px;
  background:linear-gradient(135deg,var(--teal),#0B8F74);box-shadow:var(--shadow);
  min-width:140px;min-height:44px;
}
.splash-status.is-go:hover{filter:brightness(1.09)}
.splash-status.is-go:disabled{opacity:.4;cursor:default;filter:none}
body.lang-ur .splash-status.is-go{font-size:17px;line-height:1.8}
.splash-skip{
  display:none;
}
@keyframes splashPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  .splash-name{font-size:32px;letter-spacing:.14em}
  .splash-mark{width:76px;height:76px}
}
@media(prefers-reduced-motion:reduce){
  .splash-mark,.splash-eyebrow,.splash-name,.splash-sub,.splash-lang,.splash-bar,.splash-status,.splash-skip{animation:none}
  .splash-lang-arrow,.splash-lang-row{animation:none}
  #splash{transition:opacity .15s ease}
}
